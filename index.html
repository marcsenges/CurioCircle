let catalogue=null;function validCatalogue(c){return c&&Number.isInteger(c.version)&&typeof c.published==='string'&&Array.isArray(c.questions)&&c.questions.length>=5&&c.questions.every((q,i)=>q.id===i&&['en','de','es'].every(k=>typeof q[k]==='string'&&q[k].trim()));}function applyCatalogue(c){catalogue=c;qs=c.questions.map(q=>[q.en,q.de,q.es]);}try{const c=JSON.parse(localStorage.getItem('curiocircle-catalogue'));if(validCatalogue(c))applyCatalogue(c)}catch{};const labels={en:['All questions','Favourites','Answered & next','Skip','Times answered','No favourites yet','New round'],de:['Alle Fragen','Favoriten','Beantwortet & weiter','Überspringen','Mal beantwortet','Noch keine Favoriten','Neue Runde'],es:['Todas las preguntas','Favoritas','Respondida y siguiente','Saltar','Veces respondida','Aún no hay favoritas','Nueva ronda']};

const updateLabels={en:['Update questions','Last update','Questions updated','Already up to date','Update unavailable','questions'],de:['Fragen aktualisieren','Letzte Aktualisierung','Fragen aktualisiert','Bereits aktuell','Aktualisierung nicht verfügbar','Fragen'],es:['Actualizar preguntas','Última actualización','Preguntas actualizadas','Ya está actualizado','No se ha podido actualizar','preguntas']};let updateResult=null;function render(){const u=updateLabels[state.lang];$('update').textContent=u[0];$('catalogueInfo').textContent='0.6 (Beta) · '+qs.length+' '+u[5]+(catalogue?' · '+u[1]+': ' +new Intl.DateTimeFormat({de:'de-DE',en:'en-GB',es:'es-ES'}[state.lang],{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(new Date(catalogue.published+'T00:00:00Z')):'');$('updateStatus').textContent=updateResult===null?'':u[updateResult];const l=labels[state.lang],i=deck[pos],valid=i!==undefined;document.documentElement.lang={en:'en-GB',de:'de',es:'es-ES'}[state.lang];for(const b of $('lang').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang));renderSettings();renderShare();$('question').textContent=valid?qs[i][['en','de','es'].indexOf(state.lang)]:(filter==='new'?extraLabels[state.lang][1]:l[5]);$('progress').textContent=valid?(pos+1)+' / '+deck.length:'';$('count').textContent=valid?l[4]+': '+(state.counts[i]||0):'';$('heart').textContent=state.fav.includes(i)?'♥':'♡';$('heart').setAttribute('aria-pressed',String(state.fav.includes(i)));$('answer').textContent=l[2];$('skip').textContent=l[3];for(const id of ['heart','answer','skip'])$(id).disabled=!valid||(id==='answer'&&state.mode==='rotate'&&!(state.players?.length>=2))}
function next(answer){const i=deck[pos];if(i===undefined)return;if(answer&&state.mode==='rotate'&&state.players?.length)state.turn=((state.turn||0)+1)%state.players.length;if(answer){state.counts[i]=(state.counts[i]||0)+1;save()}if(++pos>=deck.length){if(filter==='new'||filter==='fav'){shuffle()}else shuffle()}else {save();render()}}
for(const b of $('lang').querySelectorAll('button'))b.onclick=()=>{state.lang=b.dataset.lang;save();render()};$('filter').onchange=()=>{filter=$('filter').value;only=filter==='fav';shuffle()};$('heart').onclick=()=>{const i=deck[pos];if(i===undefined)return;state.fav=state.fav.includes(i)?state.fav.filter(x=>x!==i):[...state.fav,i];save();render()};$('answer').onclick=()=>next(true);$('skip').onclick=()=>next(false);const extraLabels={en:['Unanswered','All questions answered','Game settings','Game mode','Quick play','Everyone answers','Take turns','Player names (comma-separated)','Save players','New round','Everyone answers this question','Your turn: ','Enter at least two names'],de:['Unbeantwortet','Alle Fragen beantwortet','Spieleinstellungen','Spielmodus','Freies Spiel','Alle antworten','Reihum','Spielernamen (durch Kommas getrennt)','Spieler speichern','Neue Runde','Alle beantworten diese Frage','Du bist dran: ','Mindestens zwei Namen eingeben'],es:['Sin responder','Todas las preguntas respondidas','Opciones de juego','Modo de juego','Juego libre','Todos responden','Por turnos','Nombres (separados por comas)','Guardar jugadores','Nueva ronda','Todos responden a esta pregunta','Tu turno: ','Introduce al menos dos nombres']};

$('players').value=(state.players||[]).join(', ');$('mode').onchange=()=>{state.mode=$('mode').value;save();render()};$('applyPlayers').onclick=()=>{const names=$('players').value.split(',').map(n=>n.trim()).filter(Boolean);if(names.length<2){$('players').setCustomValidity(extraLabels[state.lang][12]);$('players').reportValidity();return}$('players').setCustomValidity('');state.players=names;state.turn=0;save();render();$('settingsTitle').parentElement.open=false};$('players').oninput=()=>$('players').setCustomValidity('');$('restart').onclick=()=>{state.turn=0;shuffle();$('settingsTitle').parentElement.open=false};const shareText={en:['Share with friends','Free. No account needed. No ads. Play offline. Share with friends.','Save QR code','Copy link','Share via WhatsApp','More sharing options','Install CurioCircle','Android: open in Chrome and choose Install app or Add to Home screen. iPhone: open in Safari, tap Share and Add to Home Screen.','Link copied','Previous','Try CurioCircle with me!'],de:['Mit Freunden teilen','Kostenlos. Ohne Anmeldung. Keine Werbung. Offline spielen. Mit Freunden teilen.','QR-Code speichern','Link kopieren','Per WhatsApp teilen','Weitere Teilen-Optionen','CurioCircle installieren','Android: in Chrome öffnen und App installieren oder Zum Startbildschirm hinzufügen wählen. iPhone: in Safari öffnen, Teilen und Zum Home-Bildschirm wählen.','Link kopiert','Zurück','Spiel CurioCircle mit mir!'],es:['Compartir con amigos','Gratis. Sin registro. Sin publicidad. Juega sin conexión. Comparte con tus amigos.','Guardar código QR','Copiar enlace','Compartir por WhatsApp','Más opciones para compartir','Instala CurioCircle','Android: abre Chrome y selecciona Instalar aplicación o Añadir a pantalla de inicio. iPhone: abre Safari, pulsa Compartir y Añadir a pantalla de inicio.','Enlace copiado','Anterior','¡Juega a CurioCircle conmigo!']};const shareURL='https://marcsenges.github.io/CurioCircle/';let installPrompt=null;function renderShare(){const t=shareText[state.lang];for(const [i,id] of ['shareTitle','shareBenefits','saveQR','copyLink','whatsapp','nativeShare','install','installHelp'].entries())$(id).textContent=t[i];$('shareJump').setAttribute('aria-label',t[0]);$('shareJump').title=t[0];$('back').setAttribute('aria-label',t[9]);$('back').title=t[9];$('back').disabled=pos<=0;$('nativeShare').hidden=!navigator.share;$('shareStatus').textContent=''}$('back').onclick=()=>{if(pos>0){pos--;save();render()}};$('settingsJump').onclick=()=>{const d=$('settingsTitle').parentElement;d.open=!d.open;if(d.open)d.scrollIntoView({block:'nearest'})};let lastScroll=Math.max(0,window.scrollY);window.addEventListener('scroll',()=>{const y=Math.max(0,window.scrollY);if(y<12||y<lastScroll-4)$('smartHeader').classList.remove('away');else if(y>lastScroll+4&&y>64)$('smartHeader').classList.add('away');if(Math.abs(y-lastScroll)>4||y<12)lastScroll=y},{passive:true});$('shareJump').onclick=()=>{$('sharePanel').open=true;$('sharePanel').scrollIntoView({block:'start'})};$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(shareURL);$('shareStatus').textContent=shareText[state.lang][8]}catch{window.prompt(shareText[state.lang][3],shareURL)}};$('whatsapp').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(shareText[state.lang][10]+' '+shareURL),'_blank','noopener');$('nativeShare').onclick=async()=>{try{await navigator.share({title:'CurioCircle',text:shareText[state.lang][10],url:shareURL})}catch{}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null}else $('installHelp').scrollIntoView({block:'center'})};if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(deck.length&&pos>=0&&pos<deck.length)render();else shuffle();async function updateCatalogue(manual){$('update').disabled=true;try{const res=await fetch('./questions.json',{cache:'no-s
