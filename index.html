const APP_VERSION="0.9.6.1 (Beta)";const LANGS=['en','de','es','fr','pt','it'];const LOCALES={en:'en-GB',de:'de-DE',es:'es-ES',fr:'fr-FR',pt:'pt-BR',it:'it-IT'};const LANG_NAMES={en:'English',de:'Deutsch',es:'Español',fr:'Français',pt:'Português (BR)',it:'Italiano'};let qs=[],catalogue=null;function validCatalogue(c){return c&&Number.isInteger(c.version)&&typeof c.published==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(c.published)&&Number.isFinite(Date.parse(c.published+'T00:00:00Z'))&&Array.isArray(c.questions)&&c.questions.length>=200&&c.questions.every((q,i)=>q.id===i&&LANGS.every(k=>typeof q[k]==='string'&&q[k].trim())&&(i<100||Number.isInteger(q.category)&&q.category>=0&&q.category<=5));}function applyCatalogue(c){catalogue=c;qs=c.questions.map(q=>LANGS.map(k=>q[k]));}applyCatalogue(bundledCatalogue);try{const c=JSON.parse(localStorage.getItem('curiocircle-catalogue'));if(validCatalogue(c)&&c.version>=catalogue.version)applyCatalogue(c);localStorage.setItem('curiocircle-catalogue',JSON.stringify(catalogue))}catch{};const labels={en:['All questions','Favourites','Answered & next','Skip','Times answered','No favourites yet','New round'],de:['Alle Fragen','Favoriten','Beantwortet & weiter','Überspringen','Mal beantwortet','Noch keine Favoriten','Neue Runde'],es:['Todas las preguntas','Favoritas','Respondida y siguiente','Saltar','Veces respondida','Aún no hay favoritas','Nueva ronda'],...CC_I18N.labels};
const quickText={"de":["Kostenlos","Werbefrei","Ohne Anmeldung","Offline spielbar","Filter","Filter zurücksetzen","Noch nie beantwortet","Datenschutz","Du brauchst kein Konto und musst keine persönlichen Daten angeben. Im Reihum-Modus kannst du freiwillig Namen oder Spitznamen eingeben. Sie bleiben wie Favoriten, Antwortzähler, Spielstände und eigene Fragen auf deinem Gerät. CurioCircle speichert keine gesprochenen Antworten und überträgt diese Spieldaten nicht automatisch. Der geteilte App-Link enthält keine Spieldaten. Geteilte eigene Fragen können persönliche Inhalte enthalten; eine exportierte Sicherung enthält auch lokale Spielernamen und Spielstände. Du entscheidest, ob du diese Inhalte weitergibst; externe Dienste wie WhatsApp haben eigene Datenschutzregeln. Kein Werbetracking. Für das erste Laden und Updates ist Internet nötig; der Hostinganbieter kann technische Verbindungsdaten (z. B. IP-Adressen) verarbeiten.","Frage kopiert","Teilen abgeschlossen","Teilen nicht möglich","WhatsApp geöffnet","Keine Favoriten gespeichert","Spiel & Filter","Fragen & Favoriten","Daten & Feedback","Zurück zum Spiel","Sprachen","Mit Freunden teilbar","Spieldaten bleiben lokal","Offline nach dem ersten Online-Aufruf."],"en":["Free","No ads","No account","Play offline","Filter","Reset filters","Never answered","Privacy","You do not need an account or have to provide personal details. In take-turns mode, you can optionally enter names or nicknames. They stay on your device, along with favourites, answer counts, game progress and custom questions. CurioCircle does not record spoken answers or automatically transmit this game data. The shared app link contains no game data. Shared custom questions may contain personal information; an exported backup includes local player names and game progress. You decide whether to send these; external services such as WhatsApp have their own privacy rules. No advertising tracking. Internet is needed for the first load and updates; the hosting provider may process technical connection data (e.g. IP addresses).","Question copied","Sharing completed","Unable to share","WhatsApp opened","No favourites saved","Game & filters","Questions & favourites","Data & feedback","Back to game","languages","Share with friends","Game data stays local","Play offline after the first online load."],"es":["Gratis","Sin publicidad","Sin registro","Juega sin conexión","Filtro","Restablecer filtros","Aún sin responder","Privacidad","No necesitas una cuenta ni facilitar datos personales. En el modo por turnos puedes introducir nombres o apodos de forma voluntaria. Se guardan en tu dispositivo, al igual que las favoritas, los contadores de respuestas, el progreso y tus propias preguntas. CurioCircle no graba las respuestas habladas ni envía estos datos de juego automáticamente. El enlace de la app no contiene datos de juego. Las preguntas propias que compartas pueden contener información personal; una copia de seguridad exportada incluye también los nombres de los jugadores y el progreso. Tú decides si quieres enviarlos; los servicios externos, como WhatsApp, tienen sus propias normas de privacidad. Sin seguimiento publicitario. Necesitas internet para la primera carga y las actualizaciones; el proveedor de alojamiento puede tratar datos técnicos de conexión (p. ej., direcciones IP).","Pregunta copiada","Contenido compartido","No se ha podido compartir","WhatsApp abierto","Aún no hay favoritas","Juego y filtros","Preguntas y favoritas","Datos y comentarios","Volver al juego","idiomas","Comparte con amigos","Datos de juego locales","Juega sin conexión tras el primer acceso con internet."],"fr":["Gratuit","Sans publicité","Sans compte","Joue hors connexion","Filtre","Réinitialiser les filtres","Pas encore de réponse","Confidentialité","Tu n’as pas besoin de compte ni de fournir de données personnelles. En mode chacun son tour, tu peux saisir des prénoms ou des pseudonymes si tu le souhaites. Ils restent sur ton appareil, tout comme les favoris, les compteurs de réponses, la progression et les questions personnelles. CurioCircle n’enregistre pas les réponses orales et ne transmet pas automatiquement ces données de jeu. Le lien de l’application ne contient aucune donnée de jeu. Les questions personnelles partagées peuvent contenir des informations personnelles ; une sauvegarde exportée inclut aussi les noms des joueurs et la progression. Tu décides si tu veux les transmettre ; les services externes comme WhatsApp ont leurs propres règles de confidentialité. Aucun suivi publicitaire. Une connexion est nécessaire au premier chargement et aux mises à jour ; l’hébergeur peut traiter des données techniques de connexion (p. ex. les adresses IP).","Question copiée","Partage terminé","Impossible de partager","WhatsApp ouvert","Aucun favori enregistré","Jeu et filtres","Questions et favoris","Données et avis","Retour au jeu","langues","Partage entre amis","Données de jeu locales","Joue hors connexion après le premier chargement en ligne."],"pt":["Grátis","Sem anúncios","Sem cadastro","Jogue sem internet","Filtro","Limpar filtros","Ainda não respondida","Privacidade","Você não precisa criar conta nem fornecer dados pessoais. No modo de turnos, pode inserir nomes ou apelidos se quiser. Eles ficam no seu dispositivo, assim como as favoritas, as contagens de respostas, o progresso e as perguntas personalizadas. O CurioCircle não grava respostas faladas nem envia esses dados de jogo automaticamente. O link do app não contém dados de jogo. Perguntas personalizadas compartilhadas podem conter informações pessoais; um backup exportado inclui também os nomes dos jogadores e o progresso. Você decide se quer enviá-los; serviços externos, como o WhatsApp, têm suas próprias regras de privacidade. Sem rastreamento publicitário. É preciso ter internet no primeiro acesso e nas atualizações; o provedor de hospedagem pode processar dados técnicos de conexão (por exemplo, endereços IP).","Pergunta copiada","Compartilhamento c
