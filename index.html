<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203d36"><title>CurioCircle</title><style>
*{box-sizing:border-box}body{margin:0;background:#203d36;color:#fff8e9;font:17px system-ui,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:24px 20px}header{text-align:center}h1{font-size:36px;margin:12px 0}p{line-height:1.5}small{color:#e8c886}button,select{font:inherit;padding:14px;border-radius:14px;border:1px solid #b9aa87;background:#fff8e9;color:#203d36;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e8c886;outline-offset:3px}.card{background:#fff8e9;color:#203d36;border-radius:24px;padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;margin:24px 0;box-shadow:0 8px 24px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.question{font-size:27px;font-weight:650;text-align:center;line-height:1.35}.actions{display:grid;gap:12px}.secondary{background:transparent;color:#fff8e9}.note{text-align:center;font-size:13px;color:#e8c886}#heart{padding:8px 14px;font-size:24px}footer{text-align:center;margin-top:24px} </style></head>
<body><main><header><small>EVERY QUESTION HAS A STORY</small><h1>CurioCircle</h1><p>A little curiosity. A lot of laughter.</p></header><div class="top"><select id="lang" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select><button id="filter" type="button"></button></div><section class="card"><div class="top"><span id="progress"></span><button id="heart" aria-label="Favourite" aria-pressed="false">♡</button></div><div class="question" id="question" aria-live="polite"></div><div id="count"></div></section><div class="actions"><button id="answer"></button><button class="secondary" id="skip"></button></div><footer class="note">Development preview · 0.1 · 5 sample questions</footer></main>
<script>
'use strict';
const qs=[['What was your most ridiculous purchase?','Was war dein absurdester Fehlkauf?','¿Cuál ha sido tu compra más absurda?'],['What did you want to be when you were a child?','Was wolltest du als Kind werden?','¿Qué querías ser de pequeño?'],['What harmless thing are you surprisingly bad at?','Welche harmlose Sache kannst du überraschend schlecht?','¿Qué cosa sin importancia se te da sorprendentemente mal?'],['What would your entrance music be?','Was wäre deine persönliche Einlaufmusik?','¿Con qué canción harías tu entrada triunfal?'],['Which food could you happily eat every week?','Welches Gericht könntest du jede Woche essen?','¿Qué plato comerías encantado todas las semanas?']];
const labels={en:['All questions','Favourites','Answered & next','Skip','Times answered','No favourites yet','New round'],de:['Alle Fragen','Favoriten','Beantwortet & weiter','Überspringen','Mal beantwortet','Noch keine Favoriten','Neue Runde'],es:['Todas las preguntas','Favoritas','Respondida y siguiente','Saltar','Veces respondida','Aún no hay favoritas','Nueva ronda']};
const $=id=>document.getElementById(id);let state={lang:'en',fav:[],counts:{}};try{const s=JSON.parse(localStorage.getItem('curiocircle-v1'));if(s&&labels[s.lang]&&Array.isArray(s.fav)&&s.counts)state=s}catch{};let only=false,deck=[],pos=0;
function save(){try{localStorage.setItem('curiocircle-v1',JSON.stringify(state))}catch{}}
function shuffle(){deck=qs.map((_,i)=>i).filter(i=>!only||state.fav.includes(i));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;render()}
function render(){const l=labels[state.lang],i=deck[pos],valid=i!==undefined;document.documentElement.lang={en:'en-GB',de:'de',es:'es-ES'}[state.lang];$('lang').value=state.lang;$('filter').textContent=only?l[1]:l[0];$('question').textContent=valid?qs[i][['en','de','es'].indexOf(state.lang)]:l[5];$('progress').textContent=valid?(pos+1)+' / '+deck.length:'';$('count').textContent=valid?l[4]+': '+(state.counts[i]||0):'';$('heart').textContent=state.fav.includes(i)?'♥':'♡';$('heart').setAttribute('aria-pressed',String(state.fav.includes(i)));$('answer').textContent=l[2];$('skip').textContent=l[3];for(const id of ['heart','answer','skip'])$(id).disabled=!valid}
function next(answer){const i=deck[pos];if(i===undefined)return;if(answer){state.counts[i]=(state.counts[i]||0)+1;save()}if(++pos>=deck.length)shuffle();else render()}
$('lang').onchange=e=>{state.lang=e.target.value;save();render()};$('filter').onclick=()=>{only=!only;shuffle()};$('heart').onclick=()=>{const i=deck[pos];if(i===undefined)return;state.fav=state.fav.includes(i)?state.fav.filter(x=>x!==i):[...state.fav,i];save();render()};$('answer').onclick=()=>next(true);$('skip').onclick=()=>next(false);shuffle();
</script></body></html>
