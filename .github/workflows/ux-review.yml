name: CurioCircle UX and integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [reset-09842]
permissions:
  contents: read
jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate catalogue, API and SQLite
        run: |
          node scripts/check-catalogue.mjs
          node scripts/check-mix.mjs
          node --check usage.js
          node --check design.js
          node --check app.js
          node scripts/check-release.mjs
          node scripts/check-achievements.mjs
          node scripts/check-storage.mjs
          node --experimental-sqlite backend/worker.integration.test.mjs
          python3 -m py_compile backend/deploy.py
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Test real browser at mobile and landscape sizes
        run: node scripts/ux-review.mjs
      - name: Cross-engine smoke tests (Firefox and WebKit)
        run: node scripts/cross-browser.mjs
