<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203d36"><title>CurioCircle</title><style>
*{box-sizing:border-box}body{margin:0;background:#203d36;color:#fff8e9;font:17px system-ui,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:24px 20px}header{text-align:center}h1{font-size:36px;margin:12px 0}p{line-height:1.5}small{color:#e8c886}button,select{font:inherit;padding:14px;border-radius:14px;border:1px solid #b9aa87;background:#fff8e9;color:#203d36;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e8c886;outline-offset:3px}.card{background:#fff8e9;color:#203d36;border-radius:24px;padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;margin:24px 0;box-shadow:0 8px 24px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.question{font-size:27px;font-weight:650;text-align:center;line-height:1.35}.actions{display:grid;gap:12px}.secondary{background:transparent;color:#fff8e9}.note{text-align:center;font-size:13px;color:#e8c886}#heart{padding:8px 14px;font-size:24px}footer{text-align:center;margin-top:24px} .languages{display:flex;gap:4px}.languages button{background:transparent;color:#fff8e9;border:0;padding:10px 6px;font-size:13px}.languages button[aria-pressed=true]{color:#e8c886;text-decoration:underline;font-weight:bold}button:disabled{opacity:.45;cursor:default}#filter{font-size:14px} </style></head>
<body><main><header><small>EVERY QUESTION HAS A STORY</small><h1>CurioCircle</h1><p>A little curiosity. A lot of laughter.</p></header><div class="top"><div id="lang" class="languages" aria-label="Language"><button data-lang="de">DE</button><button data-lang="en">EN</button><button data-lang="es">ES</button></div><button id="filter" type="button"></button></div><section class="card"><div class="top"><span id="progress"></span><button id="heart" aria-label="Favourite" aria-pressed="false">♡</button></div><div class="question" id="question" aria-live="polite"></div><div id="count"></div></section><div class="actions"><button id="answer"></button><button class="secondary" id="skip"></button></div><footer class="note"><span id="catalogueInfo"></span><br><button id="update" class="secondary" type="button"></button><div id="updateStatus" role="status"></div></footer></main>
<script>
'use strict';
let qs=[['What was your most ridiculous purchase?','Was war dein absurdester Fehlkauf?','¿Cuál ha sido tu compra más absurda?'],['What did you want to be when you were a child?','Was wolltest du als Kind werden?','¿Qué querías ser de pequeño?'],['What harmless thing are you surprisingly bad at?','Welche harmlose Sache kannst du überraschend schlecht?','¿Qué cosa sin importancia se te da sorprendentemente mal?'],['What would your entrance music be?','Was wäre deine persönliche Einlaufmusik?','¿Con qué canción harías tu entrada triunfal?'],['Which food could you happily eat every week?','Welches Gericht könntest du jede Woche essen?','¿Qué plato comerías encantado todas las semanas?']];
let catalogue=null;function validCatalogue(c){return c&&Number.isInteger(c.version)&&typeof c.published==='string'&&Array.isArray(c.questions)&&c.questions.length>=5&&c.questions.every((q,i)=>q.id===i&&['en','de','es'].every(k=>typeof q[k]==='string'&&q[k].trim()));}function applyCatalogue(c){catalogue=c;qs=c.questions.map(q=>[q.en,q.de,q.es]);}try{const c=JSON.parse(localStorage.getItem('curiocircle-catalogue'));if(validCatalogue(c))applyCatalogue(c)}catch{};const labels={en:['All questions','Favourites','Answered & next','Skip','Times answered','No favourites yet','New round'],de:['Alle Fragen','Favoriten','Beantwortet & weiter','Überspringen','Mal beantwortet','Noch keine Favoriten','Neue Runde'],es:['Todas las preguntas','Favoritas','Respondida y siguiente','Saltar','Veces respondida','Aún no hay favoritas','Nueva ronda']};
const $=id=>document.getElementById(id);let state={lang:'en',fav:[],counts:{}};try{const s=JSON.parse(localStorage.getItem('curiocircle-v1'));if(s&&labels[s.lang]&&Array.isArray(s.fav)&&s.counts)state=s}catch{};let only=!!state.only,deck=Array.isArray(state.deck)?state.deck.filter(i=>Number.isInteger(i)&&i>=0&&i<qs.length):[],pos=Number.isInteger(state.pos)?state.pos:0;
function save(){state.deck=deck;state.pos=pos;state.only=only;try{localStorage.setItem('curiocircle-v1',JSON.stringify(state))}catch{}}
function shuffle(){deck=qs.map((_,i)=>i).filter(i=>!only||state.fav.includes(i));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;save();render()}
const updateLabels={en:['Update questions','Last update','Questions updated','Already up to date','Update unavailable','questions'],de:['Fragen aktualisieren','Letzte Aktualisierung','Fragen aktualisiert','Bereits aktuell','Aktualisierung nicht verfügbar','Fragen'],es:['Actualizar preguntas','Última actualización','Preguntas actualizadas','Ya está actualizado','No se ha podido actualizar','preguntas']};let updateResult=null;function render(){const u=updateLabels[state.lang];$('update').textContent=u[0];$('catalogueInfo').textContent='0.2 · '+qs.length+' '+u[5]+(catalogue?' · '+u[1]+': '+catalogue.published:'');$('updateStatus').textContent=updateResult===null?'':u[updateResult];const l=labels[state.lang],i=deck[pos],valid=i!==undefined;document.documentElement.lang={en:'en-GB',de:'de',es:'es-ES'}[state.lang];for(const b of $('lang').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang));$('filter').textContent=only?l[1]:l[0];$('question').textContent=valid?qs[i][['en','de','es'].indexOf(state.lang)]:l[5];$('progress').textContent=valid?(pos+1)+' / '+deck.length:'';$('count').textContent=valid?l[4]+': '+(state.counts[i]||0):'';$('heart').textContent=state.fav.includes(i)?'♥':'♡';$('heart').setAttribute('aria-pressed',String(state.fav.includes(i)));$('answer').textContent=l[2];$('skip').textContent=l[3];for(const id of ['heart','answer','skip'])$(id).disabled=!valid}
function next(answer){const i=deck[pos];if(i===undefined)return;if(answer){state.counts[i]=(state.counts[i]||0)+1;save()}if(++pos>=deck.length)shuffle();else {save();render()}}
for(const b of $('lang').querySelectorAll('button'))b.onclick=()=>{state.lang=b.dataset.lang;save();render()};$('filter').onclick=()=>{only=!only;shuffle()};$('heart').onclick=()=>{const i=deck[pos];if(i===undefined)return;state.fav=state.fav.includes(i)?state.fav.filter(x=>x!==i):[...state.fav,i];save();render()};$('answer').onclick=()=>next(true);$('skip').onclick=()=>next(false);if(deck.length&&pos>=0&&pos<deck.length)render();else shuffle();async function updateCatalogue(manual){$('update').disabled=true;try{const res=await fetch('./questions.json',{cache:'no-store'});if(!res.ok)throw Error();const c=await res.json();if(!validCatalogue(c)||c.questions.length<qs.length)throw Error();if(catalogue&&c.version<=catalogue.version){if(manual)updateResult=3;return}const oldLength=qs.length;applyCatalogue(c);try{localStorage.setItem('curiocircle-catalogue',JSON.stringify(c))}catch{};if(!only){const extra=qs.map((_,i)=>i).filter(i=>i>=oldLength);for(let i=extra.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[extra[i],extra[j]]=[extra[j],extra[i]]}deck.push(...extra)}save();if(manual)updateResult=2}catch{if(manual)updateResult=4}finally{$('update').disabled=false;render()}}$('update').onclick=()=>updateCatalogue(true);if(!catalogue)updateCatalogue(false);
</script></body></html>
